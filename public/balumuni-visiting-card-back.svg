  <!-- Top Invocations -->
  <text x="512" y="44" text-anchor="middle" font-family="'Mukta Malar', 'Noto Sans Tamil', Arial, sans-serif" font-size="13" font-weight="bold" fill="#fcd34d" letter-spacing="1">
    உ செ சீ சப்பாணிமுத்து துணை
  </text>

  <!-- Top Brand Header Block -->
  <g transform="translate(512, 60)">
