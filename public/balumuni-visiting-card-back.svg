  <polygon points="1024,0 920,0 1024,95" fill="#f59e0b" opacity="0.8" />
  <polygon points="1024,60 970,0 1024,0" fill="#3b82f6" opacity="0.7" />

  <!-- Bottom Left Geometric Cuts -->
